# @package _global_
# One-example TinyGSM overfit. Compose with experiment=tinygsm_relay_bptt.
# The row lives in the package (relay_tinygsm/debug_data), so DATA_DIR is unused.
defaults:
  - /debug/overfit
  - override /datasets@datamodule.dataset_managers.train.lm: tinygsm_one
  - override /datasets@datamodule.dataset_managers.val.lm: tinygsm_one
  - override /datasets@datamodule.dataset_managers.val.prediction: tinygsm_one_pred
  - override /datasets@datamodule.dataset_managers.test.gsm8k_prediction: tinygsm_one_pred

per_device_batch_size: 1
global_batch_size: 1
num_dataloader_workers: 0

datamodule:
  dataset_managers:
    train:
      lm:
        collator:
          add_bos: false
    val:
      lm:
        collator:
          add_bos: false
      prediction:
        collator:
          add_bos: false
    test:
      gsm8k_prediction:
        collator:
          add_bos: false

trainer:
  precision: 32-true

predictor:
  log_rollout_diagnostics: true

tags:
  debug: tinygsm_overfit
